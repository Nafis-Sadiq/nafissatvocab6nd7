function streak(){let n=0,d=new Date();const k=x=>x.toLocaleDateString("en-CA");if(((S.log[k(d)]||{}).s||0)<900)d.setDate(d.getDate()-1);while(((S.log[k(d)]||{}).s||0)>=900){n++;d.setDate(d.getDate()-1)}return n}
function mk(w){
 const ds=DSM[w.id],r=Math.random();
 const type=ds&&r<.5?"ds":(r<.7?"ctx":"def");
 const open=w.s.some(c=>OPEN.includes(c));
 const bad=new Set(W.filter(x=>CL.some(c=>c.includes(w.w)&&c.includes(x.w))).map(x=>x.id));
 const pool=W.filter(x=>x!==w&&!bad.has(x.id)&&(open||!x.s.some(c=>w.s.includes(c))));
 const o=shuf([w,...shuf(pool).slice(0,3)]);
 return{w,o,type};
}
function pick(){
 const rec=ses.recent;
 const c=W.filter(w=>!rec.includes(w.id)).map(w=>({w,k:Math.pow(6-lv(w),2)+(S.m[w.id]?0:6)}));
 let t=c.reduce((a,b)=>a+b.k,0),r=Math.random()*t;
 for(const x of c){r-=x.k;if(r<=0)return x.w}return c[0].w;
}
function nextQ(){const w=pick();ses.recent.push(w.id);if(ses.recent.length>12)ses.recent.shift();ses.cur=mk(w);ses.pick=null;render()}
function start(){ses={left:900,q:0,c:0,recent:[],miss:{},done:false};clearInterval(timer);timer=setInterval(tick,1000);nextQ()}
function tick(){
 if(tab!=="p"||!ses||ses.done||document.hidden)return;
 ses.left--;logT().s++;save();
 const e=$("#tm");if(e)e.textContent=fmt(ses.left);
 if(ses.left<=0)finish();
}
function finish(){ses.done=true;clearInterval(timer);render()}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function ans(i){
 if(ses.pick!==null)return;
 const q=ses.cur,ok=q.o[i]===q.w;ses.pick=i;ses.q++;
 const m=S.m[q.w.id]||(S.m[q.w.id]={l:0,n:0,c:0});
 m.n++;const L=logT();L.q++;
 if(ok){m.c++;ses.c++;L.c++;m.l=Math.min(5,m.l+1)}else{m.l=Math.max(0,m.l-2);ses.miss[q.w.id]=1}
 save();render();
}
function blank(t){return t.replace("___",'<span class="blank"></span>')}
function renderQ(){
 const q=ses.cur,a=ses.pick!==null;
 let stem,body;
 if(q.type==="def"){stem="Which word matches this meaning?";body=q.w.d.replace(/\s*\(.*?\)/g,"")}
 else{stem="Which choice completes the text with the most logical and precise word or phrase?";body=blank(q.type==="ds"?DSM[q.w.id]:q.w.t)}
 let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="timer" id="tm">'+fmt(ses.left)+'</span><span class="mu">'+ses.c+"/"+ses.q+' correct</span></div></div>';
 h+='<div class="card"><div class="stem">'+stem+'</div><div class="txt">'+body+"</div>";
 q.o.forEach((o,i)=>{let c="opt";if(a){if(o===q.w)c+=" ok";else if(i===ses.pick)c+=" no"}h+='<button class="'+c+'" onclick="ans('+i+')">'+String.fromCharCode(65+i)+". "+o.w+"</button>"});
 if(a){h+='<div class="fb"><b>'+(q.o[ses.pick]===q.w?"Correct! ":"Not quite. ")+q.w.w+"</b> — "+q.w.d+(S.hide?"":'<br><span class="tag">'+sec(q.w)+"</span>")+"</div>";
  h+='<button class="btn" style="margin-top:12px" onclick="nextQ()">Next</button>'}
 h+='</div><button class="btn sec" onclick="if(confirm(\'End this session?\'))finish()">End session</button>';
 $("#app").innerHTML=h;
}
function renderSum(){
 const t=Object.keys(ses.miss).map(i=>W[i]);
 let h='<div class="card"><h2 style="margin-top:0">Session complete</h2><div class="grid"><div><b>'+ses.q+'</b><span class="mu">questions</span></div><div><b>'+ses.c+'</b><span class="mu">correct</span></div><div><b>'+(ses.q?Math.round(100*ses.c/ses.q):0)+'%</b><span class="mu">accuracy</span></div></div></div>';
 if(t.length){h+='<div class="card"><b>Review these words</b>';t.forEach(w=>h+='<div class="row"><div class="top">'+w.w+'</div><div class="mu">'+w.d+(S.hide?"":'<br><span class="tag">'+sec(w)+"</span>")+"</div></div>");h+="</div>"}
 h+='<button class="btn" onclick="ses=null;render()">Done</button>';
 $("#app").innerHTML=h;
}
function stats(){let n=0,m=0,l=0,sum=0;W.forEach(w=>{const v=lv(w);sum+=v;if(!S.m[w.id])n++;else if(v>=4)m++;else l++});return{n,m,l,p:Math.round(100*sum/(5*W.length))}}
function renderHome(){
 const t=S.log[today()]||{s:0,q:0,c:0},st=stats(),done=t.s>=900;
 $("#app").innerHTML='<div class="card"><b>Today\'s practice</b><div class="mu" style="margin:4px 0 10px">'+Math.floor(t.s/60)+" of 15 min"+(done?" — goal reached 🎉":"")+'</div><div class="bar"><i style="width:'+Math.min(100,t.s/9)+'%"></i></div><div class="mu" style="margin-top:10px">🔥 Streak: '+streak()+" day"+(streak()===1?"":"s")+" · "+t.q+" questions today</div></div>"+
 '<button class="btn" onclick="start()">Start 15-minute session</button>'+
 '<div class="card" style="margin-top:14px"><b>Overall mastery: '+st.p+'%</b><div class="bar" style="margin:8px 0 14px"><i style="width:'+st.p+'%"></i></div><div class="grid"><div><b>'+st.n+'</b><span class="mu">new</span></div><div><b>'+st.l+'</b><span class="mu">learning</span></div><div><b>'+st.m+'</b><span class="mu">mastered</span></div></div></div>'+
 syncCard()+'<p class="mu">'+W.length+" words · weak words appear more often. Each right answer adds a level (max 5); a wrong answer drops two.</p>";
}
function renderProg(){
 const st=stats();
 let list=W.filter(w=>filt==="all"||w.s.includes(filt)).sort((a,b)=>lv(a)-lv(b)||a.w.localeCompare(b.w));
 let h='<div class="card"><b>Overall: '+st.p+'% mastered</b><div class="bar" style="margin-top:8px"><i style="width:'+st.p+'%"></i></div></div>';
 if(!S.hide){h+='<select onchange="filt=this.value;render()"><option value="all">All sections</option>'+Object.keys(SEC).map(c=>'<option value="'+c+'"'+(filt===c?" selected":"")+">"+SEC[c][0]+"</option>").join("")+"</select>"}else filt="all";
 h+='<div class="card">';
 list.forEach(w=>{const m=S.m[w.id]||{n:0,c:0},v=lv(w);
  h+='<div class="row" onclick="this.querySelector(\'.dt\').hidden^=1"><div class="top"><span>'+w.w+'</span><span class="mu">'+v*20+'%</span></div><div class="bar" style="margin-top:6px"><i style="width:'+v*20+'%"></i></div><div class="dt mu" hidden style="margin-top:6px">'+w.d+" · "+m.c+"/"+m.n+" correct"+(S.hide?"":'<br><span class="tag">'+sec(w)+"</span>")+"</div></div>"});
 $("#app").innerHTML=h+"</div>";
}
function render(){
 $("#hb").textContent="Sections: "+(S.hide?"hidden":"shown");
 $("#n1").className=tab==="p"?"on":"";$("#n2").className=tab==="g"?"on":"";
 if(tab==="g")renderProg();
 else if(ses&&ses.done)renderSum();
 else if(ses)renderQ();
 else renderHome();
 scrollTo(0,0);
}
render();pull();
</script></body></html>
